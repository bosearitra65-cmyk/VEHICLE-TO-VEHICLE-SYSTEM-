        document.getElementById("testWorkflow").addEventListener("click", async () => {
            result.textContent = "Running full operational workflow...";

            const results = [];

            try {
                if (!auth.currentUser) {
                    throw new Error("Please sign in first.");
                }

                const idToken = await auth.currentUser.getIdToken();

                async function api(method, path, body = null) {
                    const options = {
                        method,
                        headers: {
                            "Authorization": `Bearer ${idToken}`,
                            "Content-Type": "application/json"
                        }
                    };

                    if (body !== null) {
                        options.body = JSON.stringify(body);
                    }

                    const response = await fetch(
                        `http://127.0.0.1:8001${path}`,
                        options
                    );

                    let data = {};
                    try {
                        data = await response.json();
                    } catch (_) {
                        data = {};
                    }

                    return { response, data };
                }

                async function ensureVehicle(vehicleId, deviceId, name) {
                    let r = await api("GET", `/api/v1/vehicles/${vehicleId}`);

                    if (r.response.status === 200) {
                        results.push(`Vehicle ${vehicleId}: already exists`);
                        return;
                    }

                    r = await api("POST", "/api/v1/vehicles", {
                        vehicle_id: vehicleId,
                        device_id: deviceId,
                        name: name
                    });

                    if (r.response.status !== 201) {
                        throw new Error(
                            `Vehicle ${vehicleId} creation failed: HTTP ${r.response.status}\n` +
                            JSON.stringify(r.data)
                        );
                    }

                    results.push(`Vehicle ${vehicleId}: created`);
                }

                await ensureVehicle(
                    "V002",
                    "TEST-V002",
                    "Test Follower Vehicle B"
                );

                await ensureVehicle(
                    "V003",
                    "TEST-V003",
                    "Test Follower Vehicle C"
                );

                let r = await api("GET", "/api/v1/convoys/C001");

                if (r.response.status === 404) {
                    r = await api("POST", "/api/v1/convoys", {
                        convoy_id: "C001",
                        name: "Test Convoy Alpha",
                        status: "planned"
                    });

                    if (r.response.status !== 201) {
                        throw new Error(
                            `Convoy creation failed: HTTP ${r.response.status}\n` +
                            JSON.stringify(r.data)
                        );
                    }

                    results.push("Convoy C001: created");
                } else if (r.response.status === 200) {
                    results.push("Convoy C001: already exists");
                } else {
                    throw new Error(
                        `Convoy lookup failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                async function ensureMember(vehicleId, role) {
                    const members = await api(
                        "GET",
                        "/api/v1/convoys/C001/members"
                    );

                    if (members.response.status !== 200) {
                        throw new Error(
                            `Member lookup failed: HTTP ${members.response.status}\n` +
                            JSON.stringify(members.data)
                        );
                    }

                    const exists = (members.data.data || []).some(
                        member => member.vehicle_id === vehicleId
                    );

                    if (exists) {
                        results.push(`C001 member ${vehicleId}: already exists`);
                        return;
                    }

                    const add = await api(
                        "POST",
                        "/api/v1/convoys/C001/members",
                        {
                            vehicle_id: vehicleId,
                            role: role
                        }
                    );

                    if (add.response.status !== 201) {
                        throw new Error(
                            `Adding ${vehicleId} to C001 failed: HTTP ${add.response.status}\n` +
                            JSON.stringify(add.data)
                        );
                    }

                    results.push(`C001 member ${vehicleId}: added as ${role}`);
                }

                await ensureMember("V001", "leader");
                await ensureMember("V002", "follower");
                await ensureMember("V003", "follower");

                r = await api(
                    "POST",
                    "/api/v1/convoys/C001/leader",
                    {
                        vehicle_id: "V001"
                    }
                );

                if (r.response.status !== 200) {
                    throw new Error(
                        `Leader assignment failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                results.push("V001: assigned as convoy leader");

                r = await api("GET", "/api/v1/routes/R001");

                        destination: "Point B",

                                [88.500, 22.730],

                            ]
                        }),
                        distance: 5.0,
                        estimated_duration: 900
                    });

                    if (r.response.status !== 201) {
                        throw new Error(
                            `Route creation failed: HTTP ${r.response.status}\n` +
                            JSON.stringify(r.data)
                        );
                    }

                    results.push("Route R001: created");
                } else if (r.response.status === 200) {
                    results.push("Route R001: already exists");
                } else {
                    throw new Error(
                        `Route lookup failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                r = await api("GET", "/api/v1/journeys/J001");

                if (r.response.status === 404) {
                    r = await api("POST", "/api/v1/journeys", {
                        journey_id: "J001",
                        convoy_id: "C001",
                        origin: "Point A",
                        destination: "Point B"
                    });

                    if (r.response.status !== 201) {
                        throw new Error(
                            `Journey creation failed: HTTP ${r.response.status}\n` +
                            JSON.stringify(r.data)
                        );
                    }

                    results.push("Journey J001: created");
                } else if (r.response.status === 200) {
                    results.push("Journey J001: already exists");
                } else {
                    throw new Error(
                        `Journey lookup failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                r = await api(
                    "POST",
                    "/api/v1/journeys/J001/route/R001"
                );

                if (r.response.status === 200) {
                    results.push("J001: route R001 assigned");
                } else if (r.response.status === 400 || r.response.status === 409) {
                    results.push(
                        `J001: route assignment returned ${r.response.status}; continuing`
                    );
                } else {
                    throw new Error(
                        `Route assignment failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                r = await api(
                    "POST",
                    "/api/v1/journeys/J001/start"
                );

                if (r.response.status === 200) {
                    results.push("J001: STARTED");
                } else {
                    throw new Error(
                        `Journey start failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                r = await api(
                    "POST",
                    "/api/v1/journeys/J001/pause"
                );

                if (r.response.status !== 200) {
                    throw new Error(
                        `Journey pause failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                results.push("J001: PAUSED");

                r = await api(
                    "POST",
                    "/api/v1/journeys/J001/resume"
                );

                if (r.response.status !== 200) {
                    throw new Error(
                        `Journey resume failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)

                }

                results.push("J001: RESUMED");

                r = await api(

                );

                if (r.response.status !== 200) {
                    throw new Error(
                        `Journey completion failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                results.push("J001: COMPLETED");

                r = await api("GET", "/api/v1/journeys/J001");

                if (r.response.status !== 200) {
                    throw new Error(
                        `Final journey verification failed: HTTP ${r.response.status}\n` +
                        JSON.stringify(r.data)
                    );
                }

                results.push(
                    "Final J001 state: " +
                    (r.data.data?.status || "unknown")
                );

                result.textContent =
                    "FULL OPERATIONAL WORKFLOW SUCCESS\n\n" +
                    results.map((x, i) => `${i + 1}. ${x}`).join("\n") +
                    "\n\nFinal Journey:\n" +
                    JSON.stringify(r.data, null, 2);

            } catch (error) {
                result.textContent =
                    "WORKFLOW STOPPED WITH ERROR\n\n" +
                    results.map((x, i) => `${i + 1}. ${x}`).join("\n") +
                    "\n\nERROR:\n" +
                    error.message;
            }

        document.getElementById("login").addEventListener("click", async () => {

            try {
                const email = document.getElementById("email").value;

                const credential = await signInWithEmailAndPassword(

                );

                const idToken = await credential.user.getIdToken();

                const response = await fetch(
                    "http://127.0.0.1:8001/api/v1/users/me",

                        }
                    }
                );

                const data = await response.json();

                result.textContent =
                    `Backend HTTP status: ${response.status}\n\n` +
                    JSON.stringify(data, null, 2);

            } catch (error) {
                result.textContent =
                    "ERROR:\n\n" +
                    error.code +
                    "\n" +
                    error.message;
            }
        });

<script>
async function runRouteStopTest() {
    const result = document.getElementById("result");

    function log(message) {
        result.textContent += "\n" + message;
    }

    function fail(message) {
        throw new Error(message);
    }

    try {
        result.textContent = "=== ROUTE STOP FUNCTIONAL TEST ===";

        const firebaseAuth = window.v2vFirebaseAuth;

        if (!firebaseAuth || !firebaseAuth.currentUser) {
            fail("Please sign in first.");
        }

        log("Authentication: OK");

        const token = await firebaseAuth.currentUser.getIdToken();

        const headers = {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
        };

        const base =
            "http://127.0.0.1:8001/api/v1/routes/R001/stops";

        async function request(label, method, url, body = null) {
            log(`\n${label}`);

            try {
                const options = {
                    method,
                    headers
                };

                if (body !== null) {
                    options.body = JSON.stringify(body);
                }

                const response = await fetch(url, options);

                log(`HTTP ${response.status}`);

                const raw = await response.text();

                let data = null;

                if (raw) {
                    try {
                        data = JSON.parse(raw);
                    } catch {
                        data = raw;
                    }
                }

                if (data !== null) {
                    log(
                        typeof data === "string"
                            ? data
                            : JSON.stringify(data, null, 2)
                    );
                }

                return {
                    response,
                    data
                };

            } catch (networkError) {
                log("NETWORK ERROR");
                log(`Name: ${networkError.name || "unknown"}`);
                log(`Message: ${networkError.message || "unknown"}`);

                throw new Error(
                    `${label} failed at browser network layer: ` +
                    `${networkError.message || networkError.name}`
                );
            }
        }

        // --------------------------------------------------
        // 1. Read current route stops.
        // --------------------------------------------------

        const initial = await request(
            "[1] Reading existing R001 stops...",
            "GET",
            base
        );

        if (initial.response.status !== 200) {
            fail(
                `Could not read R001 stops. HTTP ${initial.response.status}`
            );
        }

        const initialStops = initial.data?.data || [];

        log(
            "Existing order: " +
            initialStops
                .map(stop => `${stop.sequence}:${stop.name}`)
                .join(" → ")
        );

        // --------------------------------------------------
        // 2. Ensure C exists.
        // --------------------------------------------------

        const cExists = initialStops.some(
            stop => stop.stop_id === "R001-C"
        );

        if (cExists) {
            log("[2] C already exists -> KEEP");
        } else {
            const c = await request(
                "[2] Creating missing C...",
                "POST",
                base,
                {
                    stop_id: "R001-C",
                    sequence: 1,
                    name: "C",
                    latitude: 22.730000,
                    longitude: 88.490000,
                    status: "planned"
                }
            );

            if (![200, 201].includes(c.response.status)) {
                fail(`Could not create C. HTTP ${c.response.status}`);
            }

            log("C creation: PASS");
        }

        // --------------------------------------------------
        // 3. Ensure D exists.
        // --------------------------------------------------

        const dExists = initialStops.some(
            stop => stop.stop_id === "R001-D"
        );

        if (dExists) {
            log("[3] D already exists -> KEEP");
        } else {
            const d = await request(
                "[3] Creating missing D...",
                "POST",
                base,
                {
                    stop_id: "R001-D",
                    sequence: 2,
                    name: "D",
                    latitude: 22.735000,
                    longitude: 88.495000,
                    status: "planned"
                }
            );

            if (![200, 201].includes(d.response.status)) {
                fail(`Could not create D. HTTP ${d.response.status}`);
            }

            log("D creation: PASS");
        }

        // --------------------------------------------------
        // 4. Ensure E exists.
        // --------------------------------------------------

        const eExists = initialStops.some(
            stop => stop.stop_id === "R001-E"
        );

        if (eExists) {
            log("[4] E already exists -> KEEP");
        } else {
            const e = await request(
                "[4] Creating missing E...",
                "POST",
                base,
                {
                    stop_id: "R001-E",
                    sequence: 3,
                    name: "E",
                    latitude: 22.740000,
                    longitude: 88.500000,
                    status: "planned"
                }
            );

            if (![200, 201].includes(e.response.status)) {
                fail(`Could not create E. HTTP ${e.response.status}`);
            }

            log("E creation: PASS");
        }

        // --------------------------------------------------
        // 5. Verify complete ordered route.
        // --------------------------------------------------

        const finalList = await request(
            "[5] Verifying ordered route stops...",
            "GET",
            base
        );

        if (finalList.response.status !== 200) {
            fail(
                `Final route stop GET failed. HTTP ${finalList.response.status}`
            );
        }

        const stops = finalList.data?.data || [];

        const ordered = stops
            .map(stop => `${stop.sequence}:${stop.name}`)
            .join(" → ");

        log(`Final order: ${ordered}`);

        const expected = "1:C → 2:D → 3:E";

        if (ordered !== expected) {
            fail(
                `Ordering mismatch. Expected "${expected}", got "${ordered}"`
            );
        }

        log("ORDER VERIFICATION: PASS");

        // --------------------------------------------------
        // 6. Individual D lookup.
        // --------------------------------------------------

        const dLookup = await request(
            "[6] Looking up R001-D...",
            "GET",
            `${base}/R001-D`
        );

        if (dLookup.response.status !== 200) {
            fail(
                `R001-D lookup failed. HTTP ${dLookup.response.status}`
            );
        }

        if (dLookup.data?.data?.name !== "D") {
            fail("R001-D returned unexpected data.");
        }

        log("INDIVIDUAL LOOKUP: PASS");

        // --------------------------------------------------
        // 7. Duplicate sequence protection.
        // --------------------------------------------------

        const duplicateSequence = await request(
            "[7] Testing duplicate sequence 2...",
            "POST",
            base,
            {
                stop_id: "R001-DUP-SEQ-TEST",
                sequence: 2,
                name: "Duplicate Sequence Test",
                latitude: 22.750000,
                longitude: 88.510000,
                status: "planned"
            }
        );

        if (duplicateSequence.response.status !== 409) {
            fail(
                `Expected HTTP 409 for duplicate sequence, got HTTP ${duplicateSequence.response.status}`
            );
        }

        log("DUPLICATE SEQUENCE PROTECTION: PASS");

        // --------------------------------------------------
        // 8. Duplicate stop ID protection.
        // --------------------------------------------------

        const duplicateId = await request(
            "[8] Testing duplicate stop ID R001-C...",
            "POST",
            base,
            {
                stop_id: "R001-C",
                sequence: 99,
                name: "Duplicate ID Test",
                latitude: 22.760000,
                longitude: 88.520000,
                status: "planned"
            }
        );

        if (duplicateId.response.status !== 409) {
            fail(
                `Expected HTTP 409 for duplicate stop ID, got HTTP ${duplicateId.response.status}`
            );
        }

        log("DUPLICATE STOP ID PROTECTION: PASS");

        // --------------------------------------------------
        // 9. Final verification.
        // --------------------------------------------------

        const finalVerify = await request(
            "[9] Final route verification...",
            "GET",
            base
        );

        if (finalVerify.response.status !== 200) {
            fail(
